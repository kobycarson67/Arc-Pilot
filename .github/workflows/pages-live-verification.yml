name: ARC Pages Live Verification

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: arc-pages-live-verification
  cancel-in-progress: true

jobs:
  verify-live-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out intended deployment
        uses: actions/checkout@v4
      - name: Wait for Pages and verify public assets
        shell: bash
        env:
          LIVE_BASE: https://kobycarson67.github.io/Arc-Pilot
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          mkdir -p "$verify_dir/src" "$verify_dir/engineering"
          ready=false
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "$LIVE_BASE/app-build.js?verify=$GITHUB_SHA-$attempt" \
              --output "$verify_dir/app-build.js" && cmp --silent app-build.js "$verify_dir/app-build.js" && \
              curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "$LIVE_BASE/engineering/arc_v8_stage2_verification_page.js?verify=$GITHUB_SHA-$attempt" \
              --output "$verify_dir/engineering/arc_v8_stage2_verification_page.js" && \
              cmp --silent engineering/arc_v8_stage2_verification_page.js "$verify_dir/engineering/arc_v8_stage2_verification_page.js"; then
              ready=true
              break
            fi
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo 'Public Pages build marker did not reach the pushed main commit.' >&2
            exit 1
          fi
          for asset in index.html sw.js app-build.js app.webmanifest src/arc_titanium_visual_system.css src/arc_titanium_visual_refinement_1.css src/arc_icons.js assets/brand/runtime/arc-welding-dashboard-hero-1440.webp assets/brand/runtime/arc-titanium-industrial-background-1440.webp assets/brand/runtime/arc-welding-primary-logo-960.png assets/brand/runtime/arc-welding-lettermark-720.png assets/brand/runtime/arc-welding-compact-lockup-720.png icons/favicon-32.png icons/apple-touch-icon-180.png icons/icon-192.png icons/icon-512.png icons/icon-maskable-192.png icons/icon-maskable-512.png src/project_bank.js src/booth_assignment_lifecycle.js src/class_forecast.js src/simulation_foundation.js src/simulation_fixtures.js src/material_inventory.js src/material_inventory_presenter.js src/material_inventory_modal_lifecycle.js src/app_update_controller.js src/arc_v8_storage.js src/arc_v8_academic.js src/arc_v8_activity.js src/arc_v8_project.js src/arc_v8_evidence.js src/arc_v8_workplace_safety.js src/arc_v8_gradebook.js src/arc_gradebook_authority_adapter.js src/arc_student_history_projection.js src/arc_v8_attendance.js src/arc_v8_artifacts.js src/arc_v8_booth_operations.js src/arc_v8_backup_recovery.js src/arc_v8_behavior.js src/arc_workplace_safety_behavior_authority_adapter.js src/arc_v8_engineering_verification.js engineering/arc_v8_verification.html engineering/arc_v8_verification_page.js src/arc_v8_production_initialization.js src/arc_v8_academic_cutover.js src/arc_v8_stage2_verification.js src/arc_v8_protected_production_upgrade.js src/arc_v8_protected_production_upgrade_physical.js src/arc_v8_instructional_content_packages.js src/arc_v8_curriculum_pacing.js src/arc_v8_lesson_plans.js src/arc_v8_instructional_import_coordinator.js src/arc_v8_instructional_import_production_physical.js engineering/arc_v8_stage2_verification.html engineering/arc_v8_stage2_verification_page.js src/arc_v8_production_academic_configuration.js src/arc_v8_academic_administration.js src/arc_schedule_authority_adapter.js src/arc_academic_consumer_projection.js src/arc_academic_authority_adapter.js src/arc_attendance_authority_adapter.js src/arc_project_technical_authority_adapter.js engineering/arc_v8_production_academic_configuration.html engineering/arc_v8_production_academic_configuration_page.js; do
            mkdir -p "$verify_dir/$(dirname "$asset")"
            curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "$LIVE_BASE/$asset?verify=$GITHUB_SHA" \
              --output "$verify_dir/$asset"
            cmp --silent "$asset" "$verify_dir/$asset" || {
              echo "Public asset does not match pushed main: $asset" >&2
              exit 1
            }
          done
          grep --fixed-strings 'App & Updates' "$verify_dir/index.html"
          grep --fixed-strings 'CURRENT_SCHEMA_VERSION = 7' "$verify_dir/index.html"
          grep --fixed-strings 'ensureBoothModel' "$verify_dir/index.html"
          grep --fixed-strings 'src/project_bank.js' "$verify_dir/index.html"
          grep --fixed-strings 'src/class_forecast.js' "$verify_dir/index.html"
          grep --fixed-strings 'src/simulation_foundation.js' "$verify_dir/index.html"
          grep --fixed-strings 'Demo & Testing' "$verify_dir/index.html"
          grep --fixed-strings "build:'" "$verify_dir/app-build.js"
          grep --fixed-strings "cleanup-isolation-repair-1" "$verify_dir/app-build.js"
          grep --fixed-strings "production-academic-configuration-1" "$verify_dir/app-build.js"
          grep --fixed-strings "parity-p3-schedule-adapter-1" "$verify_dir/app-build.js"
          grep --fixed-strings "RUNTIME='stage2-reload-rehydration-repair-2-cleanup-isolation-repair-1'" "$verify_dir/src/arc_v8_stage2_verification.js"
          grep --fixed-strings "arc_v8_stage2_verification.js?v=stage2-reload-rehydration-repair-2-cleanup-isolation-repair-1" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "RUNTIME='p10d-pu2-protected-upgrade-bridge-1'" "$verify_dir/src/arc_v8_protected_production_upgrade_physical.js"
          grep --fixed-strings "UPGRADE PROTECTED PRODUCTION TO IDB14" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "V7_ONLY" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "arc_v8_protected_production_upgrade.js?v=p10d-pu2-protected-upgrade-bridge-1" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "arc_v8_protected_production_upgrade_physical.js?v=p10d-pu2-protected-upgrade-bridge-1" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "RUNTIME='p10d-pi1-production-instructional-import-bridge-1'" "$verify_dir/src/arc_v8_instructional_import_production_physical.js"
          grep --fixed-strings "IMPORT VERIFIED INSTRUCTIONAL PACKAGE UNDER V7_ONLY" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "arc_v8_instructional_import_coordinator.js?v=p10d-pi1-production-instructional-import-bridge-1" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "arc_v8_instructional_import_production_physical.js?v=p10d-pi1-production-instructional-import-bridge-1" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "arc_v8_stage2_verification_page.js?v=p10d-pi1-production-instructional-import-bridge-1-repair-1" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "instructional.inspectReadiness()" "$verify_dir/engineering/arc_v8_stage2_verification_page.js"
          if grep --fixed-strings "instructional.inspectProduction()" "$verify_dir/engineering/arc_v8_stage2_verification_page.js"; then
            echo 'Stage-2 instructional inspection must use the exported inspectReadiness API.' >&2
            exit 1
          fi
          if grep --fixed-strings "arc_v8_protected_production_upgrade_physical" "$verify_dir/index.html"; then
            echo 'Normal ARC must not load the protected production upgrade bridge.' >&2
            exit 1
          fi
          if grep --fixed-strings "arc_v8_instructional_import_production_physical" "$verify_dir/index.html"; then
            echo 'Normal ARC must not load the production instructional-import bridge.' >&2
            exit 1
          fi
          grep --fixed-strings "RUNTIME='stage2-production-academic-configuration-1'" "$verify_dir/src/arc_v8_production_academic_configuration.js"
          grep --fixed-strings "arc_v8_production_academic_configuration.js?v=stage2-production-academic-configuration-1" "$verify_dir/engineering/arc_v8_production_academic_configuration.html"
          echo "Verified public ARC Pages deployment for $GITHUB_SHA"
