name: ARC Pages Live Verification

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: arc-pages-live-verification
  cancel-in-progress: true

jobs:
  verify-live-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out intended deployment
        uses: actions/checkout@v4
      - name: Wait for Pages and verify public assets
        shell: bash
        env:
          LIVE_BASE: https://kobycarson67.github.io/Arc-Pilot
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          mkdir -p "$verify_dir/src" "$verify_dir/engineering" "$verify_dir/expected"
          git cat-file blob "$GITHUB_SHA:app-build.js" > "$verify_dir/expected/app-build.js"
          mkdir -p "$verify_dir/expected/engineering"
          git cat-file blob "$GITHUB_SHA:engineering/arc_v8_stage2_verification_page.js" > "$verify_dir/expected/engineering/arc_v8_stage2_verification_page.js"
          ready=false
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "$LIVE_BASE/app-build.js?verify=$GITHUB_SHA-$attempt" \
              --output "$verify_dir/app-build.js" && cmp --silent "$verify_dir/expected/app-build.js" "$verify_dir/app-build.js" && \
              curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "$LIVE_BASE/engineering/arc_v8_stage2_verification_page.js?verify=$GITHUB_SHA-$attempt" \
              --output "$verify_dir/engineering/arc_v8_stage2_verification_page.js" && \
              cmp --silent "$verify_dir/expected/engineering/arc_v8_stage2_verification_page.js" "$verify_dir/engineering/arc_v8_stage2_verification_page.js"; then
              ready=true
              break
            fi
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo 'Public Pages build marker did not reach the pushed main commit.' >&2
            exit 1
          fi
          mapfile -d '' release_assets < <(node -e 'const fs=require("fs"),G=require("./scripts/generate_arc_runtime_release_manifest");const c=JSON.parse(fs.readFileSync("runtime/arc_authority_closure_v1.json","utf8")),source=G.gitBlobBytes(process.cwd(),process.env.GITHUB_SHA),closure=G.discoverClosure(process.cwd(),c,{byteSource:source});if(closure.authorityAssets.length!==114||closure.reviewedNonAuthority.length!==11)throw Error(`Unexpected release inventory ${closure.authorityAssets.length}+${closure.reviewedNonAuthority.length}`);for(const p of [...closure.authorityAssets.map(x=>x.path),...closure.reviewedNonAuthority].sort())process.stdout.write(p+"\0")')
          for asset in "${release_assets[@]}"; do
            mkdir -p "$verify_dir/$(dirname "$asset")" "$verify_dir/expected/$(dirname "$asset")"
            git cat-file blob "$GITHUB_SHA:$asset" > "$verify_dir/expected/$asset"
            curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "$LIVE_BASE/$asset?verify=$GITHUB_SHA" \
              --output "$verify_dir/$asset"
            cmp --silent "$verify_dir/expected/$asset" "$verify_dir/$asset" || {
              echo "Public asset does not match immutable Git blob: $asset" >&2
              exit 1
            }
          done
          grep --fixed-strings 'App & Updates' "$verify_dir/index.html"
          grep --fixed-strings 'CURRENT_SCHEMA_VERSION = 7' "$verify_dir/index.html"
          grep --fixed-strings 'ensureBoothModel' "$verify_dir/index.html"
          grep --fixed-strings 'src/project_bank.js' "$verify_dir/index.html"
          grep --fixed-strings 'src/class_forecast.js' "$verify_dir/index.html"
          grep --fixed-strings 'src/simulation_foundation.js' "$verify_dir/index.html"
          grep --fixed-strings 'Demo & Testing' "$verify_dir/index.html"
          grep --fixed-strings "build:'" "$verify_dir/app-build.js"
          grep --fixed-strings "cleanup-isolation-repair-1" "$verify_dir/app-build.js"
          grep --fixed-strings "production-academic-configuration-1" "$verify_dir/app-build.js"
          grep --fixed-strings "parity-p3-schedule-adapter-1" "$verify_dir/app-build.js"
          grep --fixed-strings "academic-structure-operational-truth-1-repair-1" "$verify_dir/app-build.js"
          grep --fixed-strings "academic-structure-operational-truth-1-repair-2" "$verify_dir/app-build.js"
          grep --fixed-strings "academic-structure-operational-truth-1-repair-3" "$verify_dir/app-build.js"
          grep --fixed-strings "academic-authority-activation-1" "$verify_dir/app-build.js"
          grep --fixed-strings "academic-authority-activation-1-repair-5" "$verify_dir/app-build.js"
          grep --fixed-strings "academic-structure-v8-cold-start-repair-1" "$verify_dir/app-build.js"
          grep --fixed-strings "end-to-end-academic-activation-integration-rehearsal-1-instructor-first-update-recovery-1" "$verify_dir/app-build.js"
          grep --fixed-strings "samsung-apply-activation-stall-repair-1" "$verify_dir/app-build.js"
          grep --fixed-strings "samsung-startup-pending-apply-integrated-repair-1" "$verify_dir/app-build.js"
          grep --fixed-strings "classroom-roster-simulation-authority-repair-2" "$verify_dir/app-build.js"
          grep --fixed-strings "p6-samsung-err-failed-recovery-repair-1-mixed-asset-routing-repair-1" "$verify_dir/app-build.js"
          grep --fixed-strings "classroom-ready-activity-library-starter-content-1-integrated-classroom-completion-major-local-build-1-integrated-classroom-completion-major-local-build-2-integrated-classroom-completion-major-local-build-3-integrated-classroom-completion-major-local-build-4-integrated-classroom-completion-major-local-build-5-integrated-classroom-completion-major-local-build-6-integrated-classroom-completion-major-local-build-7-integrated-classroom-completion-major-local-build-8-integrated-classroom-completion-major-local-build-9" "$verify_dir/app-build.js"
          grep --fixed-strings "post-build9-classroom-ready-convergence-1-live-classroom-launch-1" "$verify_dir/app-build.js"
          grep --fixed-strings "arc_effective_section_context.js?v=academic-activation-effective-section-dependency-repair-1" "$verify_dir/engineering/arc_academic_authority_activation.html"
          grep --fixed-strings "arc_academic_consumer_projection.js?v=academic-activation-effective-section-dependency-repair-1" "$verify_dir/engineering/arc_academic_authority_activation.html"
          grep --fixed-strings "arc_academic_authority_activation.js?v=academic-activation-bell-compatibility-repair-1" "$verify_dir/engineering/arc_academic_authority_activation.html"
          grep --fixed-strings "arc_academic_authority_activation_production.js?v=academic-activation-bell-compatibility-repair-1" "$verify_dir/engineering/arc_academic_authority_activation.html"
          grep --fixed-strings "arc_academic_authority_activation_page.js?v=academic-activation-effective-section-dependency-repair-1&amp;release=samsung-waiting-release-timeout-repair-1" "$verify_dir/engineering/arc_academic_authority_activation.html"
          grep --fixed-strings "samsung-waiting-release-timeout-repair-1" "$verify_dir/sw.js"
          grep --fixed-strings "ENGINEERING / AUTHORIZED INSTRUCTOR TOOLING ONLY" "$verify_dir/engineering/arc_academic_authority_activation.html"
          if grep --fixed-strings "arc_academic_authority_activation_production" "$verify_dir/index.html"; then
            echo 'Normal ARC must not load the production academic activation bridge.' >&2
            exit 1
          fi
          grep --fixed-strings "RUNTIME='stage2-reload-rehydration-repair-2-cleanup-isolation-repair-1'" "$verify_dir/src/arc_v8_stage2_verification.js"
          grep --fixed-strings "arc_v8_stage2_verification.js?v=stage2-reload-rehydration-repair-2-cleanup-isolation-repair-1" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "RUNTIME='p10d-pu2-protected-upgrade-bridge-1'" "$verify_dir/src/arc_v8_protected_production_upgrade_physical.js"
          grep --fixed-strings "UPGRADE PROTECTED PRODUCTION TO IDB14" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "V7_ONLY" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "arc_v8_protected_production_upgrade.js?v=p10d-pu2-protected-upgrade-bridge-1" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "arc_v8_protected_production_upgrade_physical.js?v=p10d-pu2-protected-upgrade-bridge-1" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "RUNTIME='p10d-pi1-production-instructional-import-bridge-1'" "$verify_dir/src/arc_v8_instructional_import_production_physical.js"
          grep --fixed-strings "IMPORT VERIFIED INSTRUCTIONAL PACKAGE UNDER V7_ONLY" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "arc_v8_instructional_import_coordinator.js?v=p10d-pi1-production-instructional-import-bridge-1" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "arc_v8_instructional_import_production_physical.js?v=p10d-pi1-production-instructional-import-bridge-1" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "RUNTIME='p10d-pa1-production-instructional-package-availability-bridge-1'" "$verify_dir/src/arc_v8_instructional_package_availability_physical.js"
          grep --fixed-strings "MAKE VERIFIED INSTRUCTIONAL PACKAGE AVAILABLE UNDER V7_ONLY" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "arc_v8_instructional_package_availability_physical.js?v=p10d-pa1-production-instructional-package-availability-bridge-1" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "arc_v8_stage2_verification_page.js?v=p10d-pa1-production-instructional-package-availability-bridge-1" "$verify_dir/engineering/arc_v8_stage2_verification.html"
          grep --fixed-strings "instructional.inspectReadiness()" "$verify_dir/engineering/arc_v8_stage2_verification_page.js"
          if grep --fixed-strings "instructional.inspectProduction()" "$verify_dir/engineering/arc_v8_stage2_verification_page.js"; then
            echo 'Stage-2 instructional inspection must use the exported inspectReadiness API.' >&2
            exit 1
          fi
          if grep --fixed-strings "arc_v8_protected_production_upgrade_physical" "$verify_dir/index.html"; then
            echo 'Normal ARC must not load the protected production upgrade bridge.' >&2
            exit 1
          fi
          if grep --fixed-strings "arc_v8_instructional_import_production_physical" "$verify_dir/index.html"; then
            echo 'Normal ARC must not load the production instructional-import bridge.' >&2
            exit 1
          fi
          if grep --fixed-strings "arc_v8_instructional_package_availability_physical" "$verify_dir/index.html"; then
            echo 'Normal ARC must not load the production instructional-package availability bridge.' >&2
            exit 1
          fi
          grep --fixed-strings "ENGINEERING / READ-ONLY PHYSICAL VERIFICATION" "$verify_dir/engineering/arc_instructional_reference_verification.html"
          grep --fixed-strings "instructional-reference-samsung-verification-surface-1" "$verify_dir/engineering/arc_instructional_reference_verification.html"
          grep --fixed-strings "arc_instructional_reference_verification.html" "$verify_dir/sw.js"
          if grep --fixed-strings "arc_instructional_reference_physical_verification" "$verify_dir/index.html"; then
            echo 'Normal ARC must not load the instructional-reference physical verification helper.' >&2
            exit 1
          fi
          if grep --fixed-strings "arc_instructional_reference_boundary" "$verify_dir/index.html"; then
            echo 'Normal ARC must not load the instructional-reference boundary.' >&2
            exit 1
          fi
          grep --fixed-strings "RUNTIME='stage2-production-academic-configuration-closure-1'" "$verify_dir/src/arc_v8_production_academic_configuration.js"
          grep --fixed-strings "arc_v8_production_academic_configuration.js?v=stage2-production-academic-configuration-closure-1" "$verify_dir/engineering/arc_v8_production_academic_configuration.html"
          grep --fixed-strings "arc_v7_schedule_configuration_capture.js?v=academic-structure-operational-truth-1-repair-1" "$verify_dir/engineering/arc_v8_production_academic_configuration.html"
          grep --fixed-strings "arc_v8_production_academic_configuration_page.js?v=pacr-capture-review-wiring-repair-1" "$verify_dir/engineering/arc_v8_production_academic_configuration.html"
          grep --fixed-strings "arc_v8_production_academic_configuration_page.js?v=pacr-capture-review-wiring-repair-1" "$verify_dir/sw.js"
          echo "Verified public ARC Pages deployment for $GITHUB_SHA"
