name: ARC Regression Gate

on:
  push:
    branches: [ main, 'dev/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ARC static regression gate
        run: python tests/regression_static.py
      - name: Run Needs Attention behavioral tests
        run: node tests/needs_attention_engine.test.js
      - name: Run ARC data adapter tests
        run: node tests/needs_attention_arc_adapter.test.js
      - name: Run Project Checkpoint tests
        run: node tests/project_checkpoints.test.js
      - name: Run Project Checkpoint Controller tests
        run: node tests/project_checkpoint_controller.test.js
