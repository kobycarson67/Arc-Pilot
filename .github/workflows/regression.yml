name: ARC Regression Gate

on:
  push:
    branches: [ main, 'dev/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete ARC regression suite
        shell: bash
        run: |
          python tests/regression_static.py
          for test_file in tests/*.test.js; do
            node "$test_file"
          done
