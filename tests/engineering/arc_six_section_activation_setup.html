<script>
(()=>{'use strict';
const S=ArcV8Storage.STORES,PKG=ArcAcademicAuthorityActivation.constants.expected.packageId,evidence=[];
const COMMIT='a721df2689d8200b0e22267781c503e385e99ef8',TREE='f526cd3137046171f65cc12bd188c3cdb82a1aaf';
const academicConfig={schoolYear:{key:'2026-27',label:'2026-27',startDate:'2026-08-03',endDate:'2027-07-30'},semesters:[{key:'s1',code:'S1',label:'Semester 1',startDate:'2026-08-03',endDate:'2026-12-31',order:1,gradingPeriods:[{key:'q1',code:'Q1',label:'Quarter 1',startDate:'2026-08-03',endDate:'2026-10-14',order:1},{key:'q2',code:'Q2',label:'Quarter 2',startDate:'2026-10-15',endDate:'2026-12-31',order:2}]},{key:'s2',code:'S2',label:'Semester 2',startDate:'2027-01-01',endDate:'2027-07-30',order:2,gradingPeriods:[{key:'q3',code:'Q3',label:'Quarter 3',startDate:'2027-01-01',endDate:'2027-03-10',order:1},{key:'q4',code:'Q4',label:'Quarter 4',startDate:'2027-03-11',endDate:'2027-07-30',order:2}]}],currentSemesterKey:'s1'};
function clone(value){return JSON.parse(JSON.stringify(value));}
function record(step,data){evidence.push({at:new Date().toISOString(),step,...data});document.getElementById('out').textContent=JSON.stringify(evidence,null,2);}
function adapted(connection,owner){return{read:connection.read.bind(connection),add:connection.add.bind(connection),put:connection.put.bind(connection),delete:connection.delete.bind(connection),query:connection.query.bind(connection),transaction:connection.transaction.bind(connection),close:connection.close.bind(connection),generateId:()=>owner.generateId()};}
async function open(){const owner=ArcV8Storage.create({databaseName:'arc_classroom_v8',build:ARC_BUILD}),connection=await owner.open(),storage=adapted(connection,owner),backup=ArcV8BackupRecovery.create({storage,databaseName:'arc_classroom_v8',crypto,build:ARC_BUILD,now:()=> '2026-10-11T12:00:00.000Z'});return{owner,connection,storage,backup};}
function periods(times){return Object.keys(times).sort((a,b)=>Number(a)-Number(b)).map((code,index)=>({code,label:'Period '+code,startTime:times[code].start,endTime:times[code].end,order:index}));}
async function seed(){
 const {owner,connection,storage,backup}=await open(),instructional=await (await fetch('/__harness__/instructional-fixture.json')).json(),reviewed=(await (await fetch('/tests/fixtures/arc_current_editable_school_config_parity_fixture_20261004.json')).json()).currentStateExample;
 const importStores=['courses','standard_catalogs','standard_catalog_versions','standard_definitions','standard_versions','essential_standard_designations','curriculum_maps','curriculum_map_versions','curriculum_map_items','curriculum_item_standard_links','curriculum_item_competency_links','competency_definitions','competency_versions','lesson_definitions','lesson_versions','lesson_version_standard_links','lesson_version_competency_links','lesson_version_curriculum_links','lesson_version_activity_links','instructional_content_packages'];
 for(const store of importStores)for(const sourceRow of (instructional.stores[store]||[])){const row=JSON.parse(JSON.stringify(sourceRow).split('d27a218c-ea15-435f-83db-693f607c342a').join(PKG));await storage.put(store,row);}
 const academic=ArcV8Academic.create({storage,actor:'Instructor',now:()=> '2026-10-11T12:00:00.000Z'}),year=await academic.createSchoolYear(academicConfig.schoolYear),semesters={},gradingPeriods={},sections={};
 for(const sem of academicConfig.semesters){const created=await academic.createSemester({schoolYearId:year.schoolYearId,...sem});semesters[sem.key]=created;for(const gp of sem.gradingPeriods)gradingPeriods[gp.key]=await academic.createGradingPeriod({semesterId:created.semesterId,schoolYearId:year.schoolYearId,...gp});}
 for(const source of reviewed.sections){sections[source.id]=await academic.createSection({courseId:source.course==='wt'?'arc-course-wt':'arc-course-awt',schoolYearId:year.schoolYearId,semesterId:semesters.s1.semesterId,period:String(source.period),displayName:source.name,scheduleContext:{sourceSectionId:source.id}});}
 const admin=ArcV8AcademicAdministration.create({storage,backup,actor:'Instructor',now:()=> '2026-10-11T12:00:00.000Z'}),bells={};
 for(const sourceId of ['regular','late','friday'])bells[sourceId]=await admin.createBellSchedule({name:reviewed.bellSchedules[sourceId].name,periods:periods(reviewed.bellSchedules[sourceId].times)});
 const week={sunday:null,monday:{bellScheduleId:bells.regular.id,instructionMode:'regular'},tuesday:{bellScheduleId:bells.regular.id,instructionMode:'regular'},wednesday:{bellScheduleId:bells.regular.id,instructionMode:'regular'},thursday:{bellScheduleId:bells.regular.id,instructionMode:'regular'},friday:{bellScheduleId:bells.friday.id,instructionMode:'open_shop'},saturday:null};
 const mode=await admin.createScheduleMode({name:'Reviewed Schema-7 weekly schedule',effectiveFrom:semesters.s1.startDate,effectiveTo:semesters.s1.endDate,isDefault:true,week});
 for(const event of reviewed.calendarEvents)await admin.createCalendarEvent({label:event.title,startDate:event.date,endDate:event.date,time:event.time,remindDaysBefore:event.remindDaysBefore,note:'Reviewed Schema-7 event '+event.id});
 for(const [schoolDate,value] of Object.entries(reviewed.calendarOverrides)){if(schoolDate<semesters.s1.startDate||schoolDate>semesters.s1.endDate)continue;const instructional=value.dayType==='school'&&value.instructionMode!=='none';await admin.createDateOverride({schoolDate,dayType:value.dayType,instructionMode:instructional?value.instructionMode:'none',bellScheduleId:instructional?bells[value.scheduleId].id:null,reason:'Reviewed Schema-7 date override'});}
 for(const source of reviewed.sections)await admin.createSectionPlacement({sectionId:sections[source.id].sectionId,semesterId:semesters.s1.semesterId,effectiveFrom:semesters.s1.startDate,effectiveTo:semesters.s1.endDate,periodCode:String(source.period),scheduleContext:{sourceSectionId:source.id},reason:'Reviewed Schema-7 Section placement'});
 await admin.createPlanningPlacement({schoolYearId:year.schoolYearId,semesterId:semesters.s1.semesterId,effectiveFrom:semesters.s1.startDate,effectiveTo:semesters.s1.endDate,periodCode:String(reviewed.planningPeriod),reason:'Reviewed Schema-7 Planning placement'});
 const identityBindings={schoolYear:{[academicConfig.schoolYear.key]:year.schoolYearId},semesters:Object.fromEntries(Object.entries(semesters).map(([key,value])=>[key,value.semesterId])),gradingPeriods:Object.fromEntries(Object.entries(gradingPeriods).map(([key,value])=>[key,value.gradingPeriodId])),sections:Object.fromEntries(Object.entries(sections).map(([key,value])=>[key,value.sectionId]))};
 await storage.put(S.infrastructure,{id:'database-protection',mode:'Production/Classroom Protected',lifecycle:'active',revision:1});
 await storage.put(S.infrastructure,{id:'production-academic-configuration-manifest',status:'configured-pending-activation',recoveryRequired:false,authorityState:'V7_ONLY',academicAuthorityTransferred:false,realStudentDataAuthorized:false,academicFingerprint:ArcAcademicAuthorityActivation.constants.expected.academicFingerprint,scheduleSnapshotFingerprint:ArcAcademicAuthorityActivation.constants.expected.scheduleFingerprint,migrationPlanFingerprint:ArcAcademicAuthorityActivation.constants.expected.migrationPlanFingerprint,identityBindings,lifecycle:'active',revision:1});
 const audit=await backup.auditDatabase(),summary=await admin.summary();record('seeded',{databaseName:'arc_classroom_v8',physicalDatabase:window.__ARC_PHYSICAL_DB,stores:connection.storeNames.length,auditHealthy:audit.healthy,students:(await storage.query(S.students)).length,enrollments:(await storage.query(S.enrollments)).length,scheduleAssignments:(await storage.query(S.scheduleAssignments)).length,packageRows:(await storage.query(S.instructionalContentPackages)).length,schoolYear:{sourceKey:academicConfig.schoolYear.key,targetId:year.schoolYearId},semesterBindings:identityBindings.semesters,gradingPeriodBindings:identityBindings.gradingPeriods,sectionBindings:identityBindings.sections,bellBindings:Object.fromEntries(Object.entries(bells).map(([key,value])=>[key,value.id])),modeId:mode.id,sectionCount:summary.sectionPlacements.length,planningCount:summary.planningPlacements.length,futureSectionPlacements:summary.sectionPlacements.filter(x=>x.semesterId===semesters.s2.semesterId).length,futurePlanningPlacements:summary.planningPlacements.filter(x=>x.semesterId===semesters.s2.semesterId).length});connection.close();return evidence[evidence.length-1];
}
function coordinator(){return ArcAcademicAuthorityActivationProduction.create({expectedPublicationCommit:COMMIT,expectedPublicationTree:TREE,legacyStore:localStorage,build:ARC_BUILD,now:()=> '2026-10-11T12:00:00.000Z',dateProvider:()=> '2026-10-11'});}
async function activate(){const c=coordinator(),ready=await c.inspectReadiness();record('readiness',{authorityState:ready.authorityState,pacrStatus:ready.pacrStatus,semanticScheduleValid:ready.semanticScheduleValid,currentDayType:ready.currentDayType,currentInstructionMode:ready.currentInstructionMode,currentBellScheduleId:ready.currentBellScheduleId,students:ready.studentCount,enrollments:ready.enrollmentCount,scheduleAssignments:ready.scheduleAssignmentCount,sections:ready.currentEffectiveSectionCount,planning:ready.currentPlanningPlacement,roles:ready.instructionalRoleCount,links:ready.retainedLinkCount,absences:ready.intentionalAbsenceCount,identityBindings:ready.identityBindings});const prepared=await c.prepare({operator:'Instructor',commit:COMMIT,tree:TREE,rollbackRef:'rollback/pre-six-section-activation-fixture-fidelity-rehearsal-1'});let wrong=JSON.parse(prepared.recoveryPackage.text);wrong.manifest.databaseName='wrong_database';let wrongRejected=false;try{await c.loadV8Recovery(JSON.stringify(wrong));}catch(e){wrongRejected=true;record('wrong-recovery-refused',{code:e.code||null,message:e.message});}const v8=await c.loadV8Recovery(prepared.recoveryPackage.text),v7=await c.loadV7Rollback(prepared.v7RollbackPackage.text),result=await c.activate(prepared.token,ArcAcademicAuthorityActivation.constants.confirmation);record('activated',{wrongRejected,v8Verified:v8.verified,v7Verified:v7.verified,markerAuthority:result.marker.authorityState,markerWrites:1,dualWrite:result.marker.dualWrite,realStudentDataAuthorized:result.marker.realStudentDataAuthorized,v7RollbackSha256:result.marker.v7RollbackSha256,recoveryChecksum:result.marker.recoveryChecksum});return{evidence,recovery:prepared.recoveryPackage.text,v7Rollback:prepared.v7RollbackPackage.text};}
async function rollback(recovery){const c=coordinator(),before=await c.status(),result=await c.rollback({confirmation:ArcAcademicAuthorityActivation.constants.rollbackConfirmation,recoveryPackage:recovery}),after=await c.status();record('rolled-back',{before:before.authorityState,restored:result.restored,after:after.authorityState});return evidence;}
async function negative(recovery,kind){const {connection,storage,backup}=await open(),all=await storage.query(S.infrastructure);let target;if(kind==='missing-bell'){target=all.find(x=>x.authorityType==='weekly-schedule-mode'&&x.lifecycle==='active');target.week.monday={bellScheduleId:'missing-bell-id',instructionMode:'regular'};}else{const mode=all.find(x=>x.authorityType==='weekly-schedule-mode'&&x.lifecycle==='active'),bellId=mode.week.monday.bellScheduleId;target=all.find(x=>x.id===bellId);target.periods=target.periods.filter(x=>x.code!=='7');}await storage.put(S.infrastructure,target);let error=null;try{await coordinator().inspectReadiness();}catch(e){error={code:e.code||null,message:e.message,context:e.context||null};}const marker=await storage.read(S.infrastructure,ArcAcademicAuthorityActivation.constants.markerId),restored=await backup.restoreBackup(recovery);connection.close();record('negative-'+kind,{error,markerWritten:!!marker,restoreParity:restored.parity&&restored.parity.matched});return evidence;}
window.arcHarness={seed,activate,rollback,negative,evidence,academicConfig};
})();
</script>
